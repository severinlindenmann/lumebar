name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain Info
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build -c release
      - name: Smoke Checks
        run: bash scripts/ci-smoke.sh
