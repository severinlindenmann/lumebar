name: Bug report
description: Report a reproducible problem in LumeBar
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Provide enough detail for deterministic reproduction.
  - type: input
    id: version
    attributes:
      label: LumeBar version
      description: e.g. 1.0.0-beta
      placeholder: 1.0.0-beta
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: 26.3
    validations:
      required: true
  - type: input
    id: lume
    attributes:
      label: Lume CLI version
      placeholder: 0.2.76
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Include console output or screenshots if available.
